    const draw=()=>{const q=w.q,p=PORTGAME[q.i];host.innerHTML=`<div class="card" style="margin:0"><div class="flex"><b>${T(['Score','النتيجة'])}: ${w.score} / ${w.tries}</b><span>${T(['Streak','متتالي'])}: ${w.streak}</span><span>${T(['Best streak','أحسن تتالي'])}: ${w.best}</span></div>
     <p style="font-size:1.2em"><b>${q.dir==='p2n'?`${esc(p[0])} → ${tx(['which port?','أنهي Port؟'])}`:`${tx(['Port','الـ Port'])} ${esc(p[1])} → ${tx(['which protocol?','أنهي بروتوكول؟'])}`}</b></p>
     <div class="flex">${q.opts.map(o=>`<button class="btn" data-g="${esc(o)}" style="min-width:120px">${esc(o)}</button>`).join('')}</div>
     ${w.last?`<div class="fb ${w.last.ok?'ok':'bad'}">${w.last.ok?'✔':'✘'} ${esc(w.last.txt)}</div>`:''}</div>`;};
    host.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;const ok=b.dataset.g===w.q.ans,p=PORTGAME[w.q.i];w.tries++;if(ok){w.score++;w.streak++;w.best=Math.max(w.best,w.streak);}else w.streak=0;
      w.last={ok,txt:`${p[0]} = ${p[1]}`};nq();draw();};draw();},
   tasks:[{t:'custom',q:['Play until you have at least 8 correct answers with an accuracy of 80 % or more.','العب لحد ما توصل 8 إجابات صح على الأقل بدقة 80% أو أكتر.'],check:c=>{const w=c.w,acc=w.tries?w.score/w.tries:0;const ok=w.score>=8&&acc>=0.8;return {ok,msg:[`Now: ${w.score} correct of ${w.tries} (${Math.round(acc*100)} %).`,`دلوقتي: ${w.score} صح من ${w.tries} (${Math.round(acc*100)}%).`]};},sol:['Practice until you reach 8 correct with ≥ 80 % accuracy.','اتمرن لحد ما توصل 8 صح بدقة 80% أو أكتر.']},
    mc(['Which statement is the most accurate?','أنهي جملة الأدق؟'],[['HTTPS normally uses TCP 443, but HTTP/3 runs over UDP (QUIC) on port 443','الـ HTTPS عادة TCP 443، لكن HTTP/3 بيشتغل على UDP ‏(QUIC) على 443'],['HTTPS always uses TCP','الـ HTTPS دايماً TCP'],['DNS always uses UDP','الـ DNS دايماً UDP'],['FTP data always uses port 20','بيانات FTP دايماً على 20']],0,null,[null,['HTTP/3 uses QUIC over UDP.','الـ HTTP/3 بيستخدم QUIC على UDP.'],['DNS uses TCP for large responses and zone transfers.','الـ DNS بيستخدم TCP للردود الكبيرة والـ Zone transfer.'],['Passive FTP uses a negotiated high port for data.','الـ Passive FTP بيستخدم Port عالي متفق عليه.']])],
   hints:[['Group them: 20/21 FTP, 22 SSH, 23 Telnet, 25 SMTP, 53 DNS, 67/68 DHCP, 80/443 web, 161/162 SNMP.','جمّعهم: 20/21 FTP، 22 SSH، 23 Telnet، 25 SMTP، 53 DNS، 67/68 DHCP، 80/443 ويب، 161/162 SNMP.']],
   solution:[['See the port table in Key concepts.','شوف جدول الـ Ports في المفاهيم.'],['HTTPS: TCP 443 usually; HTTP/3 uses UDP 443.','الـ HTTPS: ‏TCP 443 عادة؛ HTTP/3 على UDP 443.']],
   reflect:op(['Why do clients use random high source ports while servers use well-known ports?','ليه العملاء بيستخدموا Ports عالية عشوائية والسيرفرات Ports معروفة؟'],['Clients must find the service at a known port; the client side only needs a unique, temporary port to receive replies and to separate several connections.','العميل لازم يلاقي الخدمة على Port معروف؛ وجهة العميل محتاجة بس Port مؤقت ومميز يستقبل عليه الردود ويفرّق بين كذا اتصال.'],[['Known server ports are needed to find the service','الـ Port المعروف عشان نلاقي الخدمة'],['Temporary client ports separate connections','الـ Port المؤقت بيفرّق الاتصالات']])},
  {id:'m7l3',kind:'lab',time:12,title:['DNS resolution: cache hit and cache miss','الـ DNS: ‏Cache hit و Cache miss'],topic:['Application Layer (DNS)','Application Layer (DNS)'],supp:true,
   obj:['Trace how a name is resolved when the resolver\u2019s cache has the answer and when it does not.','تتابع الاسم بيتحل إزاي لما الـ Cache عند الـ Resolver فيه الإجابة ولما مايبقاش فيها.'],
   initW:()=>({hit:false,st:{}}),
   widget:(host,w)=>{const S2=(arrows,lbl)=>SV.wrap(700,170,SV.defs+SV.pc(50,70,'PC')+SV.box(160,50,120,44,'#d8f1f1','#0f8b8d','Resolver',12)+SV.box(390,10,120,36,'#eef2f6','#41556b','Root (.)',12)+SV.box(390,62,120,36,'#eef2f6','#41556b','.com TLD',12)+SV.box(390,114,120,36,'#eef2f6','#41556b','example.com NS',12)+arrows.join('')+(lbl?SV.tx(350,166,lbl,{fs:12,b:1}):''));
    const miss=[{html:S2([SV.arrow(78,72,158,72)],'1) PC → resolver: A www.example.com? (recursive)'),cap:['The PC asks its resolver (recursive query). The PC and resolver caches are empty: CACHE MISS.','الجهاز بيسأل الـ Resolver (طلب Recursive). الـ Cache عند الجهاز والـ Resolver فاضي: Cache miss.']},
      {html:S2([SV.arrow(280,62,388,30)],'2) resolver → root'),cap:['The resolver asks a root server; the root refers it to the .com servers.','الـ Resolver بيسأل Root server؛ والـ Root بيحيله لسيرفرات .com.']},
      {html:S2([SV.arrow(280,72,388,80)],'3) resolver → .com TLD'),cap:['The resolver asks the .com TLD server; it refers it to example.com\u2019s name server.','الـ Resolver بيسأل سيرفر .com؛ وده بيحيله للـ Name server بتاع example.com.']},
      {html:S2([SV.arrow(280,84,388,130)],'4) resolver → authoritative server'),cap:['The authoritative server answers: www.example.com A 93.184.215.14, TTL 3600.','الـ Authoritative server بيرد: www.example.com A 93.184.215.14، TTL 3600.']},
      {html:S2([SV.arrow(158,80,78,80)],'5) resolver → PC (and stores it in cache for TTL seconds)'),cap:['The resolver answers the PC and CACHES the record for its TTL (3600 s).','الـ Resolver بيرد على الجهاز وبيخزن الإجابة في الـ Cache لمدة الـ TTL ‏(3600 ث).']}];
    const hit=[{html:S2([SV.arrow(78,72,158,72)],'1) PC → resolver'),cap:['A second PC asks for the same name 10 minutes later.','جهاز تاني بيسأل على نفس الاسم بعد 10 دقايق.']},{html:S2([SV.arrow(158,80,78,80)],'2) answered from cache (TTL now 3000 s)'),cap:['CACHE HIT: the resolver answers immediately from its cache — no root, TLD or authoritative queries.','Cache hit: الـ Resolver بيرد على طول من الـ Cache — من غير Root ولا TLD ولا Authoritative.']}];
    const draw=()=>{host.innerHTML=`<div class="flex"><label><input type="radio" name="dh" value="0" ${!w.hit?'checked':''}> Cache miss</label><label><input type="radio" name="dh" value="1" ${w.hit?'checked':''}> Cache hit</label></div><div data-sp></div>`;mountStepper(host.querySelector('[data-sp]'),()=>w.hit?hit:miss,w.st);};
    host.onchange=e=>{if(e.target.name==='dh'){w.hit=e.target.value==='1';w.st={};draw();}};draw();},
   tasks:[nm(['On a cache miss, how many servers does the resolver query iteratively in this example?','في الـ Cache miss، الـ Resolver سأل كام سيرفر في المثال ده؟'],3,['servers','سيرفر'],0,['Root, .com TLD and the authoritative server.','الـ Root و .com و الـ Authoritative.']),
    tf(['On a cache hit, the resolver still contacts a root server first.','في الـ Cache hit، الـ Resolver لسه بيكلّم الـ Root الأول.'],false,['A cache hit is answered locally until the TTL expires.','الـ Cache hit بيترد عليه محلياً لحد ما الـ TTL يخلص.']),
    mc(['What does the TTL of a DNS record control?','الـ TTL بتاع سجل DNS بيتحكم في إيه؟'],[['How long resolvers may keep the answer in cache','الـ Resolver يحتفظ بالإجابة في الـ Cache قد إيه'],['How many routers the DNS packet may cross','الباكت يعدّي كام راوتر'],['The size of the DNS packet','حجم باكت الـ DNS'],['The port number','رقم الـ Port']],0,null,[null,['That is the IP TTL, a different field.','ده الـ IP TTL، حقل مختلف.'],['Size is unrelated.','الحجم ملوش علاقة.'],['Port is 53.','الـ Port هو 53.']])],
   hints:[['Count the arrows from the resolver to the right-hand servers.','عدّ الأسهم من الـ Resolver للسيرفرات اللي على اليمين.']],
   solution:[['Miss: resolver queries root, TLD, authoritative (3) and caches the answer.','Miss: الـ Resolver بيسأل الـ Root والـ TLD والـ Authoritative (‏3) ويخزن الإجابة.'],['Hit: answered from cache.','Hit: الإجابة من الـ Cache.'],['TTL = cache lifetime.','الـ TTL = مدة الـ Cache.']],
   reflect:op(['After a website moves to a new IP, some users still reach the old one for an hour. Why?','بعد ما موقع اتنقل لـ IP جديد، ناس لسه بتوصل للقديم لمدة ساعة. ليه؟'],['Resolvers (and PCs) still have the old record cached until its TTL (e.g., 3600 s) expires.','الـ Resolvers (والأجهزة) لسه محتفظين بالسجل القديم في الـ Cache لحد ما الـ TTL ‏(3600 ث مثلاً) يخلص.'],[['Mentions cache and TTL','ذكرت الـ Cache والـ TTL']]),
   instr:['93.184.215.14 is used as an illustrative address for www.example.com; the real address may change.','‏93.184.215.14 عنوان توضيحي لـ www.example.com؛ العنوان الحقيقي ممكن يتغير.']},
  {id:'m7l4',kind:'lab',time:10,title:['Match DNS queries and responses','وصّل طلبات DNS بالردود'],topic:['Application Layer (DNS)','Application Layer (DNS)'],supp:true,
   obj:['Use the transaction ID together with IP addresses and ports to pair queries and responses.','تستخدم الـ Transaction ID مع الـ IPs والـ Ports عشان توصّل الطلب بالرد.'],
   given:()=>`<table class="tbl"><tr><th>Query</th><th>Client</th><th>Server</th><th>ID</th><th>Name</th></tr>${[['Q1','192.168.10.140:53211','10.10.10.53:53','0x1a01','portal.ncts.local'],['Q2','192.168.10.150:61022','10.10.10.53:53','0x1a01','mail.ncts.local'],['Q3','192.168.10.140:53290','10.10.10.53:53','0x2b07','wiki.ncts.local'],['Q4','192.168.10.145:49871','10.10.10.53:53','0x3c01','portal.ncts.local']].map(r=>`<tr>${r.map(c=>`<td class="mono">${c}</td>`).join('')}</tr>`).join('')}</table>
    <table class="tbl"><tr><th>Response</th><th>From</th><th>To</th><th>ID</th><th>Answer</th></tr>${[['R-A','10.10.10.53:53','192.168.10.150:61022','0x1a01','10.10.10.25'],['R-B','10.10.10.53:53','192.168.10.145:49871','0x3c01','10.10.10.5'],['R-C','10.10.10.53:53','192.168.10.140:53211','0x1a01','10.10.10.5'],['R-D','10.10.10.53:53','192.168.10.140:53290','0x2b07','10.10.10.15']].map(r=>`<tr>${r.map(c=>`<td class="mono">${c}</td>`).join('')}</tr>`).join('')}</table>`,
   tasks:[mt(['Match each response to its query.','وصّل كل رد بالطلب بتاعه.'],[[['R-A','R-A'],1],[['R-B','R-B'],3],[['R-C','R-C'],0],[['R-D','R-D'],2]],[['Q1','Q1'],['Q2','Q2'],['Q3','Q3'],['Q4','Q4']]),
    mc(['Q1 and Q2 both use ID 0x1a01. How can the responses still be matched correctly?','Q1 و Q2 الاتنين ID ‏0x1a01. إزاي الردود لسه بتتوصل صح؟'],[['The client IP address and port are different','الـ IP والـ Port بتوع العميل مختلفين'],['The DNS server remembers the order','سيرفر الـ DNS فاكر الترتيب'],['IDs are never reused','الـ IDs عمرها ما تتكرر'],['Responses always arrive in order','الردود دايماً بتوصل بالترتيب']],0,null,[null,['Matching is done by the client, not by order.','التوصيل بيعمله العميل مش الترتيب.'],['IDs are 16-bit and can repeat.','الـ IDs ‏16 بت وممكن تتكرر.'],['UDP does not guarantee order.','الـ UDP مش بيضمن الترتيب.']])],
   hints:[['First match the ID, then check the client IP:port.','وصّل الـ ID الأول، وبعدين اتأكد من IP:Port العميل.']],
   solution:[['R-A → Q2 (150:61022). R-B → Q4. R-C → Q1 (140:53211). R-D → Q3.','R-A → Q2 (‏150:61022). R-B → Q4. R-C → Q1 (‏140:53211). R-D → Q3.'],['ID + client IP + client port + server identify the transaction.','الـ ID + IP العميل + Port العميل + السيرفر بيحددوا العملية.']],
   reflect:op(['Why should DNS clients choose random source ports and IDs?','ليه عميل الـ DNS لازم يختار Ports و IDs عشوائية؟'],['If they are predictable, an attacker can send fake responses that match (cache poisoning). Randomness makes guessing hard.','لو متوقعة، المهاجم يقدر يبعت ردود مزيفة تطابق (‏Cache poisoning). العشوائية بتصعّب التخمين.'],[['Mentions spoofed responses / poisoning','ذكرت الردود المزيفة / الـ Poisoning']])},
  {id:'m7l5',kind:'lab',time:12,title:['DHCP: DORA and the offer','الـ DHCP: ‏DORA والـ Offer'],topic:['Application Layer (DHCP)','Application Layer (DHCP)'],
   obj:['Order the DHCP messages and read the configuration inside an offer.','ترتب رسايل الـ DHCP وتقرا الإعدادات اللي جوه الـ Offer.'],
   given:()=>`<pre>DHCP Offer  (UDP 67 → 68)  Transaction ID 0x3903f326
  Your (client) IP address : 192.168.10.200
  Option (54) Server Identifier : 10.10.10.67
  Option (51) Lease Time       : 86400 s (1 day)
  Option (1)  Subnet Mask      : 255.255.255.224
  Option (3)  Router           : 192.168.10.193
  Option (6)  DNS Server       : 10.10.10.53
  Option (15) Domain Name      : ncts.local</pre>`,
   tasks:[ord(['Order the four DHCP messages.','رتّب رسايل الـ DHCP الأربعة.'],[['Discover (client broadcast)','Discover (‏Broadcast من العميل)'],['Offer (server proposes an address)','Offer (السيرفر بيعرض عنوان)'],['Request (client asks for that address)','Request (العميل بيطلب العنوان ده)'],['Acknowledge (server confirms)','Acknowledge (السيرفر بيأكد)']]),
    fl(['Read the offer.','اقرا الـ Offer.'],[{l:['IP address for the client','الـ IP للعميل'],a:'192.168.10.200',nk:'ip'},{l:['Subnet mask','الـ Subnet mask'],a:['255.255.255.224','/27'],nk:'ip'},{l:['Default gateway','الـ Default gateway'],a:'192.168.10.193',nk:'ip'},{l:['DNS server','سيرفر DNS'],a:'10.10.10.53',nk:'ip'},{l:['Lease time (hours)','مدة الـ Lease (ساعات)'],a:24}]),
    mc(['Why is the Discover sent to 255.255.255.255 from 0.0.0.0?','ليه الـ Discover بيتبعت لـ 255.255.255.255 من 0.0.0.0؟'],[['The client has no IP yet and does not know the server','العميل لسه معندوش IP ومش عارف السيرفر'],['DHCP always uses multicast','الـ DHCP دايماً Multicast'],['To reach the Internet','عشان يوصل للإنترنت'],['Because DHCP uses TCP','عشان الـ DHCP بيستخدم TCP']],0,null,[null,['It uses broadcast here.','هنا بيستخدم Broadcast.'],['Broadcasts stay in the LAN.','الـ Broadcast بيفضل في الـ LAN.'],['DHCP uses UDP.','الـ DHCP بيستخدم UDP.']])],
   hints:[['Remember the word DORA.','افتكر كلمة DORA.'],['The “Router” option is the default gateway.','خيار “Router” هو الـ Default gateway.']],
   solution:[['Discover → Offer → Request → Acknowledge.','Discover → Offer → Request → Acknowledge.'],['IP .200, mask 255.255.255.224, gateway .193, DNS 10.10.10.53, lease 24 h.','IP ‏.200، Mask ‏255.255.255.224، Gateway ‏.193، DNS ‏10.10.10.53، الـ Lease ‏24 ساعة.'],['No IP yet → broadcast.','لسه مفيش IP → Broadcast.']],
   reflect:op(['The DHCP server is in another subnet. How can the broadcast Discover reach it?','سيرفر الـ DHCP في شبكة تانية. الـ Discover الـ Broadcast هيوصله إزاي؟'],['The router acts as a DHCP relay (ip helper-address): it receives the broadcast and forwards it as unicast to the server, adding its interface address (giaddr).','الراوتر بيشتغل DHCP relay (‏ip helper-address): بيستقبل الـ Broadcast ويبعته Unicast للسيرفر ويضيف عنوان الإنترفيس (‏giaddr).'],[['Mentions relay / ip helper-address','ذكرت الـ Relay / ip helper-address']])},
  {id:'m7l6',kind:'challenge',time:12,title:['Ping works, browsing by name fails','الـ Ping شغال، والتصفح بالاسم لأ'],topic:['Application Layer (DNS, HTTP)','Application Layer (DNS, HTTP)'],
   obj:['Reason from evidence: what the test results suggest, and what they do not prove.','تفكر من الأدلة: النتايج بتشير لإيه، وإيه اللي مش بتثبته.'],
   scenario:['A user in HR reports that http://portal.ncts.local does not open.','موظف في HR بيقول إن http://portal.ncts.local مش بيفتح.'],
   given:()=>`<pre>C:\\&gt; ping 10.10.10.5
Reply from 10.10.10.5: bytes=32 time=9ms TTL=126   (x4)

C:\\&gt; nslookup portal.ncts.local
Server:  ns1.ncts.local
Address: 10.10.10.53
*** ns1.ncts.local can't find portal.ncts.local: Non-existent domain</pre>`,
   tasks:[mc(['What do these results suggest MOST strongly?','النتايج دي بتشير لإيه بشكل أقوى؟'],[['A DNS problem: the name has no record (NXDOMAIN)','مشكلة DNS: الاسم ملوش سجل (‏NXDOMAIN)'],['The cable is unplugged','الكابل مفصول'],['The default gateway is wrong','الـ Default gateway غلط'],['TCP port 80 is blocked','الـ TCP port 80 مقفول']],0,null,[null,['Ping works, so the link is up.','الـ Ping شغال، فاللينك سليم.'],['Ping reaches a remote subnet, so the gateway works.','الـ Ping بيوصل لشبكة بعيدة، فالـ Gateway شغال.'],['Not tested yet; nslookup already shows a DNS failure.','لسه متجربش؛ والـ nslookup بيوضح مشكلة DNS أصلاً.']]),
    mc(['Which extra test would show that DNS is NOT the only problem?','أنهي اختبار زيادة يوضح إن الـ DNS مش المشكلة الوحيدة؟'],[['Opening http://10.10.10.5 directly also fails','فتح http://10.10.10.5 مباشرة بيفشل كمان'],['Pinging 10.10.10.5 again','Ping تاني لـ 10.10.10.5'],['Running ipconfig','تشغيل ipconfig'],['Restarting the PC','إعادة تشغيل الجهاز']],0,['If browsing by IP also fails, the web service, port 80 or a firewall is involved too.','لو التصفح بالـ IP فشل كمان، يبقى خدمة الويب أو Port 80 أو Firewall داخلين في المشكلة.'],[null,['Ping already works; it does not test the web service.','الـ Ping شغال أصلاً؛ ومش بيختبر خدمة الويب.'],['ipconfig shows local settings only.','الـ ipconfig بيعرض الإعدادات المحلية بس.'],['Restarting does not isolate the cause.','إعادة التشغيل مش بتحدد السبب.']]),
    ord(['Order a sensible troubleshooting sequence.','رتّب خطوات Troubleshooting منطقية.'],[['Check the PC\u2019s IP configuration (ipconfig /all)','افحص إعدادات الـ IP ‏(ipconfig /all)'],['Ping the server by IP','Ping للسيرفر بالـ IP'],['Resolve the name (nslookup)','حل الاسم (‏nslookup)'],['Open the site by IP to test the web service','افتح الموقع بالـ IP عشان تختبر خدمة الويب'],['Fix the cause and test by name again','صلّح السبب وجرّب بالاسم تاني']])],
   hints:[['“Non-existent domain” = NXDOMAIN: the DNS server replied, but the record is missing.','“Non-existent domain” = NXDOMAIN: سيرفر الـ DNS رد، بس السجل مش موجود.']],
   solution:[['Ping by IP works → Layers 1–3 and routing are fine.','الـ Ping بالـ IP شغال → طبقات 1–3 والتوجيه سليمين.'],['nslookup → NXDOMAIN: the A record is missing (or the wrong DNS server/zone).','الـ nslookup → NXDOMAIN: سجل الـ A ناقص (أو سيرفر/Zone غلط).'],['Test http://10.10.10.5 to check the web service separately.','جرّب http://10.10.10.5 عشان تختبر خدمة الويب لوحدها.']],
   reflect:op(['Why does “ping by IP works but name fails” suggest DNS without proving it?','ليه "الـ Ping بالـ IP شغال والاسم لأ" بيشير للـ DNS من غير ما يثبته؟'],['Ping only tests ICMP reachability. The browser also needs the web service (TCP 80/443), maybe a proxy, and the right name. DNS is the most likely cause, but other layers can fail too.','الـ Ping بيختبر ICMP بس. المتصفح محتاج خدمة الويب (‏TCP 80/443) وممكن Proxy والاسم الصح. الـ DNS هو الأرجح، لكن طبقات تانية ممكن تفشل كمان.'],[['Ping tests only ICMP','الـ Ping بيختبر ICMP بس'],['Web service / port / proxy can also fail','خدمة الويب / الـ Port / الـ Proxy ممكن يفشلوا']])}],
 instr:{timing:[['L6.1–7.2: 20 min · L6.3–7.5: 35 min · Challenge 15 min · discussion 10 min','‏7.1–7.2: ‏20 د · 7.3–7.5: ‏35 د · التحدي 15 د · نقاش 10 د']],

function submitExam(auto){if(!auto){const un=EXAM.filter(q=>!grade(q,'ex_'+q.id).answered).length;if(un&&!confirm(tx([`${un} question(s) are unanswered. Submit anyway?`,`فيه ${un} سؤال من غير إجابة. تسلّم برضه؟`])))return;}

  h+=`<div class="card"><h3>${T(['Course plan and suggested timing','خطة الكورس والتوقيت المقترح'])}</h3><table class="tbl"><tr><th>${T(UI.module)}</th><th>${T(['Time','الوقت'])}</th><th>${T(['Labs','المعامل'])}</th><th>${T(UI.timing)}</th></tr>${MODS.map(m=>`<tr><td>${m.n}. ${T(m.title)}</td><td class="c">${m.time} ${T(UI.min)}</td><td class="c">${m.labs.length}</td><td>${T(m.instr.timing[0])}</td></tr>`).join('')}<tr><td>${T(UI.exam)} + ${T(UI.final)}</td><td class="c">90 ${T(UI.min)}</td><td class="c">—</td><td>${T(['Exam 45 min · integrated challenge 45 min','الامتحان 45 د · التحدي 45 د'])}</td></tr></table>
   ${TP(['This Instructor edition is a presentation convenience, not secure access control. Students receive the separate   ; its answers are obfuscated but not securely hidden.','نسخة المدرّب دي للتسهيل مش للحماية. الطلبة بياخدوا      المنفصلة؛ وإجاباتها متشوّشة لكن مش مستخبية بأمان.'])}<h4>${T(['Classroom tips','نصايح للفصل'])}</h4>${UL([['Use A+ (projector mode) for larger text. Use EN + ع while teaching, and let students choose their language.','استخدم A+ للخط الكبير. استخدم EN + ع وإنت بتشرح، وسيب الطلبة يختاروا لغتهم.'],['Answers stay collapsed until a student presses Show Solution; in Instructor view the question bank also has “Reveal all answers”.','الإجابات بتفضل مقفولة لحد ما الطالب يضغط "اعرض الحل"؛ وفي عرض المدرّب بنك الأسئلة فيه "اكشف كل الإجابات".'],['Progress is saved in this browser when possible. Ask students to export a JSON backup at the end of the session.','التقدم بيتحفظ في المتصفح لو ينفع. خلّي الطلبة يعملوا Export لملف JSON في آخر الجلسة.'],['Real-tool activities (Wireshark, Packet Tracer, CLI) are optional and marked as such.','الأنشطة بأدوات حقيقية (Wireshark و Packet Tracer و CLI) اختيارية ومتعلّم عليها.']])}
   <div class="btns"><button class="btn" data-print="w:all">🖨 ${T(['Print all student worksheets','اطبع كل أوراق الطلبة'])}</button><button class="btn pri" data-print="k:all">🖨 ${T(['Print full instructor answer key','اطبع مفتاح الإجابات كامل'])}</button></div></div>`;
  h+=MODS.map(m=>instrBlock(m)).join('');$('#main').innerHTML=h;}
/* ----- progress ----- */
function pageProgress(){const tot=MODS.reduce((s,m)=>{const p=modProg(m);s.L+=p.L;s.Ld+=p.Ld;s.Q+=p.Q;s.Qd+=p.Qd;return s;},{L:0,Ld:0,Q:0,Qd:0});
  $('#main').innerHTML=`<h1>💾 ${T(UI.progress)}</h1>${STORE_OK?'':`<div class="note-store">${T(['Your browser blocked local storage for this file, so progress is kept only while the page is open. Use Export to save it.','المتصفح قافل التخزين المحلي للملف ده، فالتقدم محفوظ طول ما الصفحة مفتوحة بس. استخدم Export عشان تحفظه.'])}</div>`}
   <div class="card">${STU?`<div class="flex"><label>${T(['Name','الاسم'])} <input class="inp" id="pName" value="${esc(S.name)}"></label><button class="btn" id="pNameB">${T(['Save','احفظ'])}</button></div>`:''}
   <table class="tbl"><tr><th>${T(UI.module)}</th><th>${T(['Labs','المعامل'])}</th><th>${T(UI.qbank)}</th><th>%</th></tr>${MODS.map(m=>{const p=modProg(m);return `<tr><td>${m.n}. ${T(m.title)}</td><td class="c">${p.Ld} / ${p.L}</td><td class="c">${p.Qd} / ${p.Q}</td><td class="c">${p.pct}%</td></tr>`;}).join('')}
   <tr><th>${T(['Total','الإجمالي'])}</th><th>${tot.Ld} / ${tot.L}</th><th>${tot.Qd} / ${tot.Q}</th><th></th></tr></table>
   <p>${T(UI.exam)}: <b>${S.exam?`${S.exam.score} / ${S.exam.total}`:'—'}</b> · ${T(UI.final)}: <b>${['vlsm','topo','faults','trace'].filter(k=>S.final[k]).length} / 4</b></p>
   <div class="btns"><button class="btn pri" id="pExp">⬇ ${T(['Export progress (JSON)','تصدير التقدم (JSON)'])}</button><label class="btn">⬆ ${T(['Import progress','استيراد التقدم'])}<input type="file" id="pImp" accept=".json,application/json" style="display:none"></label>
   <button class="btn" data-print="res">🖨 ${T(['Print results summary','اطبع ملخص النتايج'])}</button><button class="btn" id="pReset" style="border-color:#a3261d;color:#a3261d">🗑 ${T(['Reset all progress','امسح كل التقدم'])}</button></div><div id="pMsg"></div></div>`;
  if(STU)$('#pNameB').onclick=()=>{S.name=$('#pName').value.trim().slice(0,60);save();head();};
  $('#pExp').onclick=()=>{const data=JSON.stringify({app:'ncts-\u006fffline-labs',exported:new Date().toISOString(),state:S},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`networking-labs-progress-${(S.name||'student').replace(/[^\w\u0600-\u06FF-]+/g,'_')}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);$('#pMsg').innerHTML=`<div class="fb ok">${T(['Export started (check your Downloads folder).','التصدير بدأ (شوف فولدر Downloads).'])}</div>`;};
  $('#pImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);const st=d&&d.state;if(!st||st.v!==1||(st.ed&&st.ed!==EDITION)||typeof st.labs!=='object'||typeof st.qb!=='object')throw new Error('bad');S=Object.assign(DEF(),st);save();head();renderSide();pageProgress();$('#pMsg').innerHTML=`<div class="fb ok">${T(['Progress imported.','التقدم اتستورد.'])}</div>`;}catch(_){$('#pMsg').innerHTML=`<div class="fb bad">${T(['This file is not a valid progress export.','الملف ده مش ملف تقدم صحيح.'])}</div>`;}};rd.readAsText(f);};
  $('#pReset').onclick=()=>{if(confirm(tx(['Delete ALL progress, answers and your name on this computer? This cannot be undone.','تمسح كل التقدم والإجابات واسمك من الجهاز ده؟ مش هينفع ترجّعه.']))){const keep={mode:S.mode,view:S.view,big:S.big};S=Object.assign(DEF(),keep);Object.keys(RUN).forEach(k=>delete RUN[k]);Object.keys(ANS).forEach(k=>delete ANS[k]);save();head();renderSide();pageProgress();}};}
/* ===================== PRINT ===================== */
function printQ(q,key,withKey,n){let h=`<div class="pa-item"><b>${n}.</b> ${TP(q.q)}`;if(q.pre)h+=`<pre>${esc(q.pre)}</pre>`;
  if(q.t==='mcq'){const p=perm('print_'+key,q.o.length);h+=`<ol type="A">${p.map(i=>`<li>${T(q.o[i])}</li>`).join('')}</ol>`;}
  else if(q.t==='tf')h+=`<p>☐ ${T(UI.tf_t)} &nbsp; ☐ ${T(UI.tf_f)}</p>`;
  else if(q.t==='order'){const p=perm('print_o_'+key,q.o.length,true);h+=`<p class="small">${T(['Number the items in the correct order:','رقّم العناصر بالترتيب الصح:'])}</p><ul>${p.map(i=>`<li>___ ${T(q.o[i])}</li>`).join('')}</ul>`;}
  else if(q.t==='match')h+=`<p class="small">${T(['Options','الاختيارات'])}: ${q.cats.map(c=>tx(c)).join(' · ')}</p><ul>${q.items.map(it=>`<li>${T(it[0])} → ____________</li>`).join('')}</ul>`;
  else if(q.t==='fields')h+=`<ul>${q.f.map(f=>`<li>${T(f.l)}: ____________________</li>`).join('')}</ul>`;
  else if(q.t==='custom')h+=`<p class="small">${T(['(Interactive task — complete it in the HTML workbook.)','(مهمة تفاعلية — اعملها في ملف الـ HTML.)'])}</p>`;
  else h+=`<div class="pa-ans"></div>`;
  if(withKey){h+=`<div class="sol"><b>${T(UI.answer)}:</b> ${fmtAns(q)}${q.x?`<div>${T(q.x)}</div>`:''}</div>`;}
  return h+'</div>';}
function printMod(m,withKey){let h=`<section class="pa-mod"><h1>${T(UI.module)} ${m.n}: ${TT(m.title)}</h1><p class="small">${S.name?esc(S.name)+' · ':''}${T(['Name: ____________  Date: ________','الاسم: ____________  التاريخ: ________'])}</p><h3>${T(UI.objectives)}</h3>${UL(m.obj)}`;
  if(withKey)h+=instrBlock(m);
  m.labs.forEach((l,li)=>{const g=l.gen?l.gen(1):null,tasks=g?g.tasks:l.tasks,given=g?g.given:l.given,gv=typeof given==='function'?given():given;
    h+=`<h2>${m.n}.${li+1} ${TT(l.title)}</h2><p class="small">${T(KINDS[l.kind])} · ⏱ ${l.time} ${T(UI.min)} · ${T(l.topic)}</p>${TP(l.obj)}${l.scenario?TP(l.scenario):''}${l.diagram&&typeof l.diagram==='string'?`<div class="diag">${l.diagram}</div>`:''}${gv?(isP(gv)?TP(gv):gv):''}${l.widget?`<p class="small">${T(['This lab includes an interactive simulation in the HTML workbook.','المعمل ده فيه محاكاة تفاعلية في ملف الـ HTML.'])}</p>`:''}`;
    tasks.forEach((q,i)=>{h+=printQ(q,l.id+'_'+i,withKey,i+1);});
    if(l.reflect)h+=`<div class="pa-item"><b>${T(UI.why)}</b> ${TP(l.reflect.q)}${withKey?`<div class="sol">${TP(l.reflect.model)}</div>`:'<div class="pa-ans" style="min-height:4em"></div>'}</div>`;
    if(withKey){const sol=g?g.solution:l.solution;h+=`<div class="sol"><b>${T(UI.solution)}</b>${OL(sol)}</div>`;}});
  h+=`<h2>${T(UI.qbank)}</h2>`+QB[m.id].map((q,i)=>printQ(q,q.id,withKey,i+1)).join('');return h+'</section>';}
function doPrint(kind){let h='';const [k,scope]=kind.split(':');if(STU&&k==='k')return;
  if(kind==='res'||kind==='exres'){h=`<section><h1>${T(['Results summary','ملخص النتايج'])}</h1><p>${T(['Name','الاسم'])}: <b>${esc(S.name||'—')}</b> · ${new Date().toLocaleString()}</p><table class="tbl"><tr><th>${T(UI.module)}</th><th>${T(['Labs','المعامل'])}</th><th>${T(UI.qbank)}</th><th>%</th></tr>${MODS.map(m=>{const p=modProg(m);return `<tr><td>${m.n}. ${T(m.title)}</td><td>${p.Ld}/${p.L}</td><td>${p.Qd}/${p.Q}</td><td>${p.pct}%</td></tr>`;}).join('')}</table>
    <p>${T(UI.exam)}: <b>${S.exam?`${S.exam.score} / ${S.exam.total} (${Math.round(100*S.exam.score/S.exam.total)}%)`:'—'}</b></p>${S.exam&&S.exam.byMod?`<table class="tbl"><tr><th>${T(UI.module)}</th><th>${T(UI.exam)}</th></tr>${MODS.map(m=>{const b=S.exam.byMod[m.id];return b?`<tr><td>${m.n}. ${T(m.title)}</td><td>${b.c}/${b.t}</td></tr>`:'';}).join('')}</table>`:''}
    <p>${T(UI.final)}: ${['vlsm','topo','faults','trace'].map(x=>`${x} ${S.final[x]?'✔':'—'}`).join(' · ')}</p></section>`;}
  else{const withKey=k==='k';const mods=scope==='all'?MODS:MODS.filter(m=>m.id===scope);
    h=`<section><h1>${withKey?T(['Instructor answer key','مفتاح إجابات المدرّب']):T(['Student worksheet','ورقة عمل الطالب'])}</h1><p class="small">NCTS Networking    Labs</p></section>`+mods.map(m=>printMod(m,withKey)).join('');
    if(scope==='all')h+=`<section class="pa-mod"><h1>${T(UI.exam)}</h1>${EXAM.map((q,i)=>printQ(q,q.id,withKey,i+1)).join('')}</section>`;}
  $('#printArea').innerHTML=h;setTimeout(()=>{window.print();},50);}
window.addEventListener('afterprint',()=>{$('#printArea').innerHTML='';});

/* ===================== ROUTER & INIT ===================== */
function route(){head();renderSide();const mn=$('#main');mn.onclick=mn.oninput=mn.onchange=null;const r=(location.hash||'#m/4').slice(1).split('/');window.scrollTo(0,0);
  if(r[0]==='m'&&r[2]==='qb')pageQB(+r[1]);else if(r[0]==='m')pageModule(+r[1]);else if(r[0]==='exam')pageExam();else if(r[0]==='final')pageFinal();
  else if(r[0]==='glossary')pageGloss();else if(r[0]==='guide')pageGuide();else if(r[0]==='progress')pageProgress();else pageHome();
  if(!STORE_OK&&!document.getElementById('storeNote'))$('#main').insertAdjacentHTML('afterbegin',`<div class="note-store" id="storeNote">${T(['Local storage is not available for this file in your browser. Your progress will be lost when you close the page — use Progress & export → Export.','التخزين المحلي مش متاح للملف ده في المتصفح. تقدمك هيضيع لما تقفل الصفحة — استخدم "التقدم والتصدير" ← Export.'])}</div>`);
  $('#side').classList.remove('open');}
function rerender(){const y=window.scrollY;route();window.scrollTo(0,y);}
window.addEventListener('hashchange',route);
$('#langSeg').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){S.mode=b.dataset.mode;save();rerender();}};

$('#bigBtn').onclick=()=>{S.big=!S.big;save();head();};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('click',e=>{const p=e.target.closest('[data-print]');if(p){e.preventDefault();doPrint(p.dataset.print);return;}const j=e.target.closest('[data-jump]');if(j){e.preventDefault();const t=document.getElementById(j.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth'});}});
const SPLIT_MODULE=4;

function splitLinks(){}

renderSide=function(){const m=MODS.find(m=>m.n===SPLIT_MODULE);$('#side').innerHTML=`<a class="on" href="#m/${m.n}">${m.n}. ${T(m.title)}</a><div class="grp">Assessment & resources</div><a href="#m/${m.n}/qb">Question bank</a><a href="#exam">Final exam</a><a href="#home">All question banks & resources</a><a href="#final">Integrated challenge</a><a href="#glossary">Glossary</a><a href="#progress">Progress & export</a>`;};
const originalPageModule=pageModule;
pageModule=function(n){originalPageModule(n);};
pageHome=function(){$('#main').innerHTML=`<h1>Exam, Question Banks & Resources</h1><div class="card"><h2>Your name</h2><input class="inp" id="splitName" value="${esc(S.name)}"><button class="btn pri" id="splitSave">Save</button></div><div class="flex"><a class="btn pri" href="#exam">Final exam</a><a class="btn" href="#final">Integrated challenge</a><a class="btn" href="#glossary">Glossary</a><a class="btn" href="#progress">Progress & export</a>${STU?'':'<a class="btn" href="#guide">Instructor guide</a>'}</div><h2>Question banks</h2><div class="grid">${MODS.map(m=>`<a class="mod-tile" href="#m/${m.n}/qb"><h3>${m.n}. ${T(m.title)}</h3><p>${QB[m.id].length} questions</p></a>`).join('')}</div>`;$('#splitSave').onclick=()=>{S.name=$('#splitName').value.trim().slice(0,60);save();head();};};

const originalRoute=route;route=function(){originalRoute();splitLinks();};

route();
</script>
</body>
</html>
